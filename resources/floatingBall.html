<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      .floating-ball {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        position: relative;
        cursor: pointer;
        -webkit-app-region: drag;
        transition: transform 0.15s ease;
      }
      .floating-ball::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(
          from 0deg,
          #f43f5e,
          #ec4899,
          #a855f7,
          #6366f1,
          #3b82f6,
          #06b6d4,
          #10b981,
          #eab308,
          #f97316,
          #f43f5e
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        transition: transform 0.15s ease;
        animation: none;
      }
      .floating-ball:hover::before {
        animation: border-spin 2s linear infinite;
      }
      @keyframes border-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .floating-ball-inner {
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        /* 内圈不接收鼠标，让外层 drag 区域可以拖拽 */
      }
      /* 点击检测区：仅在字母区域 */
      .floating-ball-letter {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
        /* no-drag 使字母区域可以接收点击事件 */
        -webkit-app-region: no-drag;
        cursor: pointer;
        background: conic-gradient(
          from 0deg,
          #f43f5e,
          #ec4899,
          #a855f7,
          #6366f1,
          #3b82f6,
          #06b6d4,
          #10b981,
          #eab308,
          #f97316,
          #f43f5e
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .floating-ball.pressing {
        transform: scale(0.92);
      }
      .floating-ball.file-hover::before {
        animation: border-spin 1s linear infinite;
      }
      .floating-ball.file-hover .floating-ball-inner {
        background: rgba(80, 130, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="floating-ball" id="ball">
      <div class="floating-ball-inner">
        <span class="floating-ball-letter">Z</span>
      </div>
    </div>
    <script>
      const { ipcRenderer, webUtils } = require('electron')
      const path = require('path')
      const fs = require('fs')
      const ball = document.getElementById('ball')
      const letterEl = document.querySelector('.floating-ball-letter')

      // ==================== 点击检测（字母区域） ====================
      let lastClickTime = 0
      const DOUBLE_CLICK_DELAY = 300

      letterEl.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          e.stopPropagation()
          ball.classList.add('pressing')
        }
      })

      letterEl.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
          e.stopPropagation()
          ball.classList.remove('pressing')
          const now = Date.now()
          if (now - lastClickTime < DOUBLE_CLICK_DELAY) {
            ipcRenderer.send('floating-ball-double-click')
            lastClickTime = 0
          } else {
            ipcRenderer.send('floating-ball-click')
            lastClickTime = now
          }
        }
      })

      // 右键菜单
      ball.addEventListener('contextmenu', (e) => {
        e.preventDefault()
        ipcRenderer.send('floating-ball-contextmenu')
      })

      // ==================== 接收文字配置 ====================
      ipcRenderer.on('floating-ball-set-letter', (_event, letter) => {
        if (letterEl) {
          letterEl.textContent = letter || 'Z'
        }
      })

      // ==================== 文件拖放 ====================
      document.addEventListener('dragover', (e) => {
        e.preventDefault()
        e.stopPropagation()
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'
        ball.classList.add('file-hover')
      })
      document.addEventListener('dragleave', (e) => {
        e.preventDefault()
        e.stopPropagation()
        ball.classList.remove('file-hover')
      })
      document.addEventListener('drop', (e) => {
        e.preventDefault()
        e.stopPropagation()
        ball.classList.remove('file-hover')
        const files = e.dataTransfer && e.dataTransfer.files
        if (!files || files.length === 0) return
        const fileItems = []
        for (let i = 0; i < files.length; i++) {
          const filePath = webUtils.getPathForFile(files[i])
          if (!filePath) continue
          try {
            const stat = fs.statSync(filePath)
            fileItems.push({
              path: filePath,
              name: path.basename(filePath),
              isDirectory: stat.isDirectory()
            })
          } catch (err) {
            console.warn('无法读取文件信息:', filePath, err)
          }
        }
        if (fileItems.length > 0) {
          ipcRenderer.send('floating-ball-file-drop', fileItems)
        }
      })
    </script>
  </body>
</html>
